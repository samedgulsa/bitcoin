<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Canlı Haber Takipçisi & Veri Madencisi</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card: #1a1a26;
      --card-hover: #1f1f2e;
      --accent: #e63946;
      --accent2: #ff6b6b;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(230,57,70,0.4);
      --text: #f0f0f5;
      --muted: #8888aa;
      --faint: #444466;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'SF Pro Display', -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .cnn-badge {
      background: var(--accent);
      color: white;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .brand-name { font-size: 16px; font-weight: 600; color: var(--text); }

    .status-area {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
    }

    .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      position: relative; flex-shrink: 0;
    }

    .pulse::after {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      background: rgba(34,197,94,0.3);
      animation: pulseAnim 2s infinite;
    }

    .pulse.error { background: var(--accent); }
    .pulse.error::after { background: rgba(230,57,70,0.3); }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.5); opacity: 0; }
    }

    #status-text { font-size: 12px; color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 20px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      transition: border-color 0.2s;
    }

    .stat:hover { border-color: rgba(255,255,255,0.12); }
    .stat-val { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-val.accent { color: var(--accent); }
    .stat-val.gold { color: #f59e0b; }
    .stat-val.blue { color: #3b82f6; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

    .progress-bar {
      height: 2px; background: var(--surface);
      border-radius: 2px; margin-bottom: 20px; overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%; border-radius: 2px;
    }

    .controls {
      display: flex; gap: 10px; margin-bottom: 16px;
      flex-wrap: wrap; align-items: center;
    }

    .search-wrap { flex: 1; min-width: 200px; position: relative; }

    .search-wrap input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-size: 13px;
      outline: none; transition: border-color 0.2s;
    }

    .search-wrap input::placeholder { color: var(--faint); }
    .search-wrap input:focus { border-color: rgba(255,255,255,0.2); }

    .search-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--faint); font-size: 14px; pointer-events: none;
    }

    .filter-btns { display: flex; gap: 6px; }

    .filter-btn {
      font-size: 12px; padding: 7px 14px;
      border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }

    .filter-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
    .filter-btn.saved-active { background: #f59e0b; border-color: #f59e0b; color: #1a0a00; }

    .action-btn {
      font-size: 12px; padding: 7px 14px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      cursor: pointer; transition: all 0.15s;
    }
    .action-btn:hover { background: #2a2a36; border-color: var(--muted); }
    .action-btn.download { background: #2563eb; border: none; color: white; font-weight: 600; }

    .sort-bar {
      display: flex; gap: 0; margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .sort-tab {
      font-size: 13px; padding: 8px 16px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted); cursor: pointer;
      transition: all 0.15s; margin-bottom: -1px;
    }

    .sort-tab:hover { color: var(--text); }
    .sort-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      animation: fadeIn 0.35s ease;
      display: flex; flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      background: var(--card-hover);
    }

    .card-img {
      width: 100%; height: 170px;
      object-fit: cover; display: block;
      background: var(--surface);
    }

    .card-no-img {
      width: 100%; height: 50px;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
    }

    .card-no-img span { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; }

    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-dates {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .date-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .date-label {
      color: var(--faint);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
      min-width: 80px;
    }

    .date-value {
      color: var(--muted);
      font-size: 11.5px;
    }

    .card-badges {
      display: flex; align-items: center;
      gap: 6px; flex-shrink: 0;
    }

    .new-pill {
      background: rgba(230,57,70,0.15);
      color: #f87171; font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
      border: 1px solid rgba(230,57,70,0.3);
      letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
    }

    .parsed-pill {
      background: rgba(34,197,94,0.15);
      color: #4ade80; font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
      border: 1px solid rgba(34,197,94,0.3);
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    .save-btn {
      background: none; border: none; cursor: pointer;
      color: var(--faint); font-size: 15px; padding: 2px 4px;
      border-radius: 4px; transition: color 0.15s, transform 0.15s;
    }

    .save-btn:hover { transform: scale(1.2); }
    .save-btn.saved { color: #f59e0b; }

    .card-title {
      font-size: 13.5px; font-weight: 500;
      color: var(--text); line-height: 1.55; margin-bottom: 12px;
    }

    .card-link {
      font-size: 12px; color: var(--accent2);
      text-decoration: none; font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px;
      opacity: 0.85; transition: opacity 0.15s;
      margin-top: auto;
    }

    .card-link:hover { opacity: 1; text-decoration: underline; }

    .empty {
      grid-column: 1 / -1;
      text-align: center; padding: 60px 20px;
      color: var(--faint); font-size: 14px;
    }

    #toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 18px;
      font-size: 13px; color: var(--text);
      transform: translateY(60px); opacity: 0;
      transition: all 0.3s ease; z-index: 999; max-width: 280px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }

    #log-container {
      position: fixed;
      bottom: 80px; left: 20px;
      width: 300px; max-height: 150px;
      background: rgba(10,10,15,0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace; font-size: 10px;
      overflow-y: auto; color: #4ade80;
      z-index: 998; pointer-events: none;
      display: none;
    }

    @media (max-width: 800px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      body { padding: 14px; }
      .header { flex-direction: column; align-items: flex-start; gap: 15px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <span class="cnn-badge">CNN</span>
      <span class="brand-name">Canlı Haber Takipçisi & Madenci</span>
    </div>
    <div class="status-area">
      <div class="pulse" id="dot"></div>
      <span id="status-text">Bağlanıyor...</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="total-count">0</div>
      <div class="stat-label">Keşfedilen</div>
    </div>
    <div class="stat">
      <div class="stat-val blue" id="parsed-count">0</div>
      <div class="stat-label">Full Parse Edilen</div>
    </div>
    <div class="stat">
      <div class="stat-val accent" id="new-count">0</div>
      <div class="stat-label">Son 30 Dakika</div>
    </div>
    <div class="stat">
      <div class="stat-val gold" id="saved-count">0</div>
      <div class="stat-label">Kaydedilen</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="Haberlerde ara..." />
    </div>
    <div class="filter-btns">
      <button class="filter-btn active" data-filter="all">Tümü</button>
      <button class="filter-btn" data-filter="saved">⭐ Kaydedilenler</button>
    </div>
    <button class="action-btn download" onclick="exportFullDatabase()">📥 Veritabanını İndir (.JSON)</button>
    <button class="action-btn" id="notif-btn">🔔 Bildirim</button>
  </div>

  <div class="sort-bar">
    <button class="sort-tab active" data-sort="new">En Yeni</button>
    <button class="sort-tab" data-sort="old">En Eski</button>
  </div>

  <div id="news-grid" class="grid"></div>
  
  <div id="log-container"></div>
  <div id="toast"></div>

<script>
  // --- YAPILANDIRMA ---
  const PROXY = ""; 
  const XML_URL = "https://www.cnn.com/sitemap/news.xml";
  const INTERVAL_MS = 30000;

  // --- DURUM YÖNETİMİ ---
  let allNews = []; // Sitemap'ten gelen temel liste
  let fullDatabase = JSON.parse(localStorage.getItem('cnn_full_db') || '[]'); // Detaylı içerik havuzu
  let savedUrls = new Set(JSON.parse(localStorage.getItem('cnn_saved') || '[]'));
  let currentFilter = 'all';
  let currentSort = 'new';
  let searchQuery = '';
  let notifEnabled = false;
  let isParsing = false;

  // --- YARDIMCI FONKSİYONLAR ---
  function log(msg) {
    const container = document.getElementById('log-container');
    container.style.display = 'block';
    const line = document.createElement('div');
    line.textContent = `> ${new Date().toLocaleTimeString()}: ${msg}`;
    container.appendChild(line);
    container.scrollTop = container.scrollHeight;
    if (container.childNodes.length > 20) container.removeChild(container.firstChild);
  }

  function formatDiff(pubDate, detectedAt) {
    if (!pubDate || !detectedAt) return '—';
    const diff = Math.round((new Date(detectedAt) - new Date(pubDate)) / 1000);
    if (diff < 0) return '—';
    if (diff < 60) return diff + ' sn sonra yakalandı';
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    if (m < 60) return m + ' dk ' + s + ' sn sonra yakalandı';
    const h = Math.floor(m / 60);
    return h + ' sa ' + (m % 60) + ' dk sonra yakalandı';
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    return isNaN(d) ? '—' : d.toLocaleString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function isNew(dateStr) {
    return (Date.now() - new Date(dateStr).getTime()) < 30 * 60 * 1000;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // --- VERİ KAYDETME / YÜKLEME ---
  function syncStorage() {
    localStorage.setItem('cnn_saved', JSON.stringify([...savedUrls]));
    localStorage.setItem('cnn_full_db', JSON.stringify(fullDatabase));
  }

  function toggleSave(url) {
    if (savedUrls.has(url)) {
      savedUrls.delete(url);
      showToast('Kaldırıldı');
    } else {
      savedUrls.add(url);
      showToast('⭐ Haber kaydedildi');
    }
    syncStorage();
    updateStats();
    renderGrid();
  }

  function updateStats() {
    document.getElementById('total-count').textContent = allNews.length;
    document.getElementById('parsed-count').textContent = fullDatabase.length;
    document.getElementById('new-count').textContent = allNews.filter(n => isNew(n.pubDate)).length;
    document.getElementById('saved-count').textContent = savedUrls.size;
  }

  // --- DETAYLI HABER PARSER (SCRAPER) ---
  async function scrapeArticle(url) {
    try {
      const response = await fetch(PROXY + url);
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      const result = {
        "icerik_id": Date.now() + Math.floor(Math.random() * 1000),
        "baslik": doc.querySelector('h1.headline__text')?.innerText.trim() || doc.title,
        "kaynak_url": url,
        "kayit_tarihi": new Date().toISOString(),
        "bolumler": []
      };

      const elements = doc.querySelectorAll('.paragraph-elevate, .subheader-elevate, .image_large-elevate');
      let currentSection = { "bolum_basligi": "Giriş", "metin_icerigi": "", "gorseller": [] };

      elements.forEach((el) => {
        if (el.classList.contains('subheader-elevate')) {
          if (currentSection.metin_icerigi || currentSection.gorseller.length > 0) result.bolumler.push({ ...currentSection });
          currentSection = { "bolum_basligi": el.innerText.trim(), "metin_icerigi": "", "gorseller": [] };
        } 
        else if (el.classList.contains('paragraph-elevate')) {
          currentSection.metin_icerigi += el.innerText.trim() + "\n\n";
        }
        else if (el.classList.contains('image_large-elevate')) {
          const img = el.querySelector('img');
          if (img) {
            currentSection.gorseller.push({
              "gorsel_link": img.src || img.getAttribute('data-url'),
              "resim_aciklamasi": el.querySelector('.inline-placeholder')?.innerText.trim() || ""
            });
          }
        }
      });
      result.bolumler.push(currentSection);
      return result;
    } catch (e) {
      console.error("Scrape Error:", url, e);
      return null;
    }
  }

  // --- UI RENDER ---
  function renderGrid() {
    let items = [...allNews];
    if (currentFilter === 'saved') items = items.filter(n => savedUrls.has(n.loc));
    if (searchQuery) items = items.filter(n => n.title.toLowerCase().includes(searchQuery.toLowerCase()));
    if (currentSort === 'old') items.reverse();

    const grid = document.getElementById('news-grid');
    if (items.length === 0) {
      grid.innerHTML = '<div class="empty">Haber bulunamadı</div>';
      return;
    }

    grid.innerHTML = items.map(n => {
      const isSaved = savedUrls.has(n.loc);
      const isParsed = fullDatabase.some(db => db.kaynak_url === n.loc);
      const imgHtml = n.img 
        ? `<img class="card-img" src="${n.img}" alt="" loading="lazy" onerror="this.style.display='none'">` 
        : `<div class="card-no-img"><span>Görsel Yok</span></div>`;

      return `
        <div class="card">
          ${imgHtml}
          <div class="card-body">
            <div class="card-meta">
              <div class="card-dates">
                <div class="date-row"><span class="date-label">Yayın</span><span class="date-value">${formatDate(n.pubDate)}</span></div>
                <div class="date-row"><span class="date-label">Sistem</span><span class="date-value">${formatDate(n.detectedAt)}</span></div>
                <div class="date-row"><span class="date-label">Gecikme</span><span class="date-value" style="color:var(--success)">${formatDiff(n.pubDate, n.detectedAt)}</span></div>
              </div>
              <div class="card-badges">
                ${isNew(n.pubDate) ? '<span class="new-pill">Yeni</span>' : ''}
                ${isParsed ? '<span class="parsed-pill">İşlendi</span>' : ''}
                <button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${n.loc}')">${isSaved ? '⭐' : '☆'}</button>
              </div>
            </div>
            <div class="card-title">${n.title}</div>
            <a class="card-link" href="${n.loc}" target="_blank">Habere Git →</a>
          </div>
        </div>`;
    }).join('');
  }

  // --- ANA DÖNGÜ VE VERİ ÇEKME ---
  async function updateNews() {
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    
    try {
      const resp = await fetch(PROXY + XML_URL);
      const text = await resp.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const urlNodes = Array.from(xml.getElementsByTagName('url'));
      
      let newFoundLinks = [];
      const existingMap = new Map(allNews.map(n => [n.loc, n]));

      urlNodes.forEach(node => {
        const loc = node.getElementsByTagName('loc')[0]?.textContent.trim();
        if (!loc) return;

        const lastmod = node.querySelector('lastmod')?.textContent?.trim() || new Date().toISOString();
        let pubDate = node.getElementsByTagName('news:publication_date')[0]?.textContent.trim() || lastmod;
        let title = node.getElementsByTagName('news:title')[0]?.textContent.trim() || "CNN Haberi";
        let img = node.getElementsByTagName('image:loc')[0]?.textContent.trim() || "";

        if (existingMap.has(loc)) {
          existingMap.get(loc).lastmod = lastmod;
        } else {
          const newItem = { loc, title, lastmod, pubDate, img, detectedAt: new Date().toISOString() };
          allNews.unshift(newItem);
          newFoundLinks.push(loc);
        }
      });

      if (allNews.length > 500) allNews = allNews.slice(0, 500);
      
      updateStats();
      renderGrid();

      // Arka Planda İçerik Madenciliği (Sırayla)
      if (newFoundLinks.length > 0) {
        log(`${newFoundLinks.length} yeni haber bulundu. İçerikler kazınıyor...`);
        processParsingQueue(newFoundLinks);
      }

      dot.className = 'pulse';
      statusText.textContent = `Aktif — ${allNews.length} izlemede`;
      startProgress();

    } catch (err) {
      dot.className = 'pulse error';
      statusText.textContent = 'Bağlantı Hatası';
      console.error(err);
    }
  }

  async function processParsingQueue(links) {
    if (isParsing) return;
    isParsing = true;
    for (const link of links) {
      if (fullDatabase.some(db => db.kaynak_url === link)) continue;
      log(`Kazınıyor: ${link.split('/').pop()}`);
      const detailedData = await scrapeArticle(link);
      if (detailedData) {
        fullDatabase.push(detailedData);
        syncStorage();
        updateStats();
        // Görselde 'İşlendi' pill'ini göstermek için render
        renderGrid();
      }
      await new Promise(r => setTimeout(r, 1000)); // Rate limit dostu
    }
    isParsing = false;
    log("Tüm yeni içerikler veritabanına eklendi.");
  }

  function startProgress() {
    const bar = document.getElementById('progress');
    bar.style.transition = 'none';
    bar.style.width = '0%';
    setTimeout(() => {
      bar.style.transition = `width ${INTERVAL_MS}ms linear`;
      bar.style.width = '100%';
    }, 50);
  }

  function exportFullDatabase() {
    const dataStr = JSON.stringify(fullDatabase, null, 4);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cnn_full_archive_${Date.now()}.json`;
    a.click();
    showToast('Veritabanı dışa aktarıldı');
  }

  // --- EVENT LISTENERS ---
  document.getElementById('search-input').addEventListener('input', e => { searchQuery = e.target.value; renderGrid(); });
  
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'saved-active'));
      btn.classList.add('active');
      if (btn.dataset.filter === 'saved') btn.classList.add('saved-active');
      currentFilter = btn.dataset.filter;
      renderGrid();
    });
  });

  document.querySelectorAll('.sort-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentSort = tab.dataset.sort;
      renderGrid();
    });
  });

  // Başlat
  updateNews();
  setInterval(updateNews, INTERVAL_MS);
</script>

</body>
</html>
