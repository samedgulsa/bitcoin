<!DOCTYPE html>
<html>

<head>
    <title>BTC/USDT MA Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.js"></script>
    <style>
        body {
            background: #131722;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            background: #1e2329;
            padding: 20px;
            border-radius: 12px;
        }

        canvas {
            width: 100% !important;
            height: 500px !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="chart"></canvas>
    </div>

    <script>
        function calcSMA(data, p) {
            return data.map((_, i) => i < p - 1 ? null : data.slice(i - p + 1, i + 1).reduce((a, b) => a + b, 0) / p);
        }

        function calcEMA(data, p) {
            const k = 2 / (p + 1);
            let prev = data[0];
            return data.map((v, i) => i < p - 1 ? null : (prev = v * k + prev * (1 - k)));
        }

        async function init() {
            const res = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=1000');
            const json = await res.json();
            const closes = json.map(d => parseFloat(d[4]));
            const candles = json.map(d => ({
                x: d[0],
                o: parseFloat(d[1]),
                h: parseFloat(d[2]),
                l: parseFloat(d[3]),
                c: parseFloat(d[4])
            }));

            const sma7 = calcSMA(closes, 7).map((v, i) => ({ x: json[i][0], y: v }));
            const ema25 = calcEMA(closes, 25).map((v, i) => ({ x: json[i][0], y: v }));
            const ma50 = calcSMA(closes, 50).map((v, i) => ({ x: json[i][0], y: v }));

            new Chart(document.getElementById('chart'), {
                type: 'candlestick',
                data: {
                    datasets: [
                        {
                            type: 'candlestick',
                            label: 'Fiyat',
                            data: candles,
                            // Renk ayarlarını buradaki gibi detaylandırabilirsin
                            color: {
                                up: '#26a69a',    // Yükseliş mumunun iç rengi
                                down: '#ef5350',  // Düşüş mumunun iç rengi
                                unchanged: '#9194a3'
                            },
                            // --- DEĞİŞİKLİK BURADA ---
                            borderColor: {
                                up: '#26a69a',    // Yükseliş mumunun kenar rengi
                                down: '#ef5350',  // Düşüş mumunun kenar rengi
                                unchanged: '#9194a3'
                            },
                            borderWidth: 1,       // 1 yaparak o kalınlığı inceltiyoruz
                            // ------------------------
                            order: 4
                        },
                        {
                            type: 'line',
                            label: 'SMA (7)',
                            data: sma7,
                            borderColor: '#f0b90b',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.1,
                            order: 1
                        },
                        {
                            type: 'line',
                            label: 'EMA (25)',
                            data: ema25,
                            borderColor: '#2196f3',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.1,
                            order: 2
                        },
                        {
                            type: 'line',
                            label: 'MA (50)',
                            data: ma50,
                            borderColor: '#9c27b0',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.1,
                            order: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#131722',
                            borderColor: '#363a45',
                            borderWidth: 1,
                            titleColor: '#9194a3',
                            bodyColor: '#d1d4dc',
                            padding: 10,
                            callbacks: {
                                label: ctx => {
                                    if (ctx.dataset.type === 'candlestick') {
                                        const r = ctx.raw;
                                        return ` O:${r.o.toFixed(2)} H:${r.h.toFixed(2)} L:${r.l.toFixed(2)} C:${r.c.toFixed(2)}`;
                                    }
                                    return ctx.parsed.y !== null ? ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}` : '';
                                }
                            }
                        }
                    },
                    scales: {
                        x: { type: 'timeseries', grid: { display: false }, ticks: { color: '#9194a3', maxTicksLimit: 10 } },
                        y: { grid: { color: '#2a2e39' }, ticks: { color: '#9194a3' } }
                    }
                }
            });
        }

        init();
    </script>
</body>

</html>
