<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MACD Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0b0e11; color: #eaecef; margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 95%; max-width: 1100px; background: #1e2329; padding: 20px; border-radius: 12px; }
        canvas { width: 100% !important; height: 500px !important; }
    </style>
</head>
<body>
<div class="container">
    <canvas id="macd"></canvas>
</div>

<script>

function calcEMA(data, period) {
    const k = 2 / (period + 1);
    return data.reduce((ema, val, i) => {
        ema.push(i === 0 ? val : val * k + ema[i - 1] * (1 - k));
        return ema;
    }, []);
}

async function init() {
    const res = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=300');
    const json = await res.json();
    const prices = json.map(d => parseFloat(d[4]));
    const labels = json.map(d => new Date(d[0]).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }));
    const ema12 = calcEMA(prices, 12);
    const ema26 = calcEMA(prices, 26);

    // MACD Çizgisi: 12 EMA - 26 EMA
    const macd = ema12.map((v, i) => v - ema26[i]);
    const signal = calcEMA(macd, 9);
    const hist = macd.map((m, i) => m - signal[i]);

    new Chart(document.getElementById('macd'), {
        type: 'bar',
        data: {
            labels,
            datasets: [
                {
                    type: 'bar',
                    label: 'Histogram',
                    data: hist,
                    backgroundColor: hist.map(v => v >= 0 ? 'rgba(38,166,154,0.6)' : 'rgba(239,83,80,0.6)'),
                    borderWidth: 0,
                    order: 3
                },
                {
                    type: 'line',
                    label: 'MACD',
                    data: macd,
                    borderColor: '#2962FF',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.1,
                    order: 1
                },
                {
                    type: 'line',
                    label: 'Sinyal',
                    data: signal,
                    borderColor: '#FF6D00',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.1,
                    order: 2
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e2329',
                    borderColor: '#2b2f36',
                    borderWidth: 1,
                    titleColor: '#848e9c',
                    bodyColor: '#eaecef',
                    padding: 10,
                    callbacks: {
                        label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(4)}`
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { color: '#848e9c', maxTicksLimit: 10 }
                },
                y: {
                    grid: { color: '#2b2f36' },
                    ticks: { color: '#848e9c' }
                }
            }
        }
    });
}

init();
</script>
</body>
</html>
