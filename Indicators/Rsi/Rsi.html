<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Binance RSI Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0b0e11; color: #eaecef; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1100px; background: #1e2329; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { width: 100% !important; height: 500px !important; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="rsiChart"></canvas>
</div>

<script>
const CONFIG = {
    symbol: 'BTCUSDT',
    interval: '15m',
    limit: 1000,
    rsiPeriod: 14
};

function calculateRSI(closes, period) {
    let rsi = new Array(closes.length).fill(null);
    let gains = [], losses = [];

    for (let i = 1; i < closes.length; i++) {
        let diff = closes[i] - closes[i - 1];
        gains.push(Math.max(0, diff));
        losses.push(Math.max(0, -diff));
    }

    let avgG = gains.slice(0, period).reduce((a, b) => a + b) / period;
    let avgL = losses.slice(0, period).reduce((a, b) => a + b) / period;

    for (let i = period; i < closes.length; i++) {
        rsi[i] = 100 - (100 / (1 + avgG / (avgL || 1e-5)));
        avgG = (avgG * (period - 1) + gains[i]) / period;
        avgL = (avgL * (period - 1) + losses[i]) / period;
    }
    return rsi;
}

const safeZonePlugin = {
    id: 'safeZone',
    beforeDraw: (chart) => {
        const { ctx, chartArea: { left, width }, scales: { y } } = chart;
        const y70 = y.getPixelForValue(70);
        const y30 = y.getPixelForValue(30);

        ctx.save();
        ctx.fillStyle = 'rgba(240, 185, 11, 0.03)';
        ctx.fillRect(left, y70, width, y30 - y70);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.setLineDash([5, 5]);
        [70, 30].forEach(v => {
            const yPos = y.getPixelForValue(v);
            ctx.beginPath();
            ctx.moveTo(left, yPos);
            ctx.lineTo(left + width, yPos);
            ctx.stroke();
        });
        ctx.restore();
    }
};

async function init() {
    const url = `https://api.binance.com/api/v3/klines?symbol=${CONFIG.symbol}&interval=${CONFIG.interval}&limit=${CONFIG.limit}`;
    const res = await fetch(url);
    const rawData = await res.json();

    const labels = rawData.map(d => new Date(d[0]).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }));
    const closes = rawData.map(d => parseFloat(d[4]));
    const rsiData = calculateRSI(closes, CONFIG.rsiPeriod);

    new Chart(document.getElementById('rsiChart').getContext('2d'), {
        type: 'line',
        data: {
            labels,
            datasets: [{
                data: rsiData,
                borderColor: '#f0b90b',
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    backgroundColor: '#1e2329',
                    borderColor: '#f0b90b',
                    borderWidth: 1,
                    titleColor: '#848e9c',
                    bodyColor: '#f0b90b',
                    padding: 10,
                    callbacks: {
                        title: (items) => items[0].label,
                        label: (ctx) => ctx.parsed.y !== null ? ` RSI: ${ctx.parsed.y.toFixed(2)}` : ''
                    }
                }
            },
            scales: {
                y: { min: 0, max: 100, grid: { color: '#2b2f36' }, ticks: { color: '#848e9c' } },
                x: { grid: { display: false }, ticks: { color: '#848e9c', maxTicksLimit: 10 } }
            }
        },
        plugins: [safeZonePlugin]
    });
}

init();
</script>
</body>
</html>
